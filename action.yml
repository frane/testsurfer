name: Set up testsurfer
description: Prepare a GitHub runner to run testsurfer suites. On Linux, installs WebKitGTK 6 and starts a virtual display; on macOS there is nothing to install.
branding:
  icon: check-circle
  color: blue

inputs:
  vibesurfer-version:
    description: vibesurfer release to fetch and start. Empty uses the version this testsurfer release pins.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install WebKitGTK 6 and Xvfb
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q --no-install-recommends \
          libwebkitgtk-6.0-4 libgtk-4-1 xvfb dbus-x11
        # WebKitGTK's web process runs in a bubblewrap sandbox, which
        # needs unprivileged user namespaces. Ubuntu 24.04 restricts
        # them through AppArmor, and the web view then crashes on its
        # first navigation.
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

    - name: Start a virtual display
      if: runner.os == 'Linux'
      shell: bash
      run: |
        # Trusted input goes through XTest, so the web view needs a
        # real X display, not just an offscreen surface. Room for a
        # 4x3 grid of 1600x1000 tiles: vibesurfer gives each page window
        # its own, so parallel tests never take each other's clicks.
        Xvfb :99 -screen 0 6416x3016x24 -nolisten tcp >/tmp/xvfb.log 2>&1 &
        for _ in $(seq 1 50); do
          [ -e /tmp/.X11-unix/X99 ] && break
          sleep 0.1
        done
        echo "DISPLAY=:99" >> "$GITHUB_ENV"

    - name: Fetch and start vibesurfer (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        VS_VERSION: ${{ inputs.vibesurfer-version }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        # The release zip directly, checksum-verified, rather than the
        # npm launcher, whose unpacking needs vibesurfer 0.2.16+ under
        # Git Bash.
        $v = $env:VS_VERSION
        if (-not $v) {
          $v = (Select-String -Path (Join-Path $env:ACTION_PATH 'src/client.ts') -Pattern "PINNED_VIBESURFER = '(.*)'").Matches[0].Groups[1].Value
        }
        $asset = "vs-v$v-x86_64-pc-windows-msvc.zip"
        $base = "https://github.com/frane/vibesurfer/releases/download/v$v"
        $dir = Join-Path $env:RUNNER_TEMP "vibesurfer-$v"
        New-Item -ItemType Directory -Force $dir | Out-Null
        Invoke-WebRequest "$base/$asset" -OutFile (Join-Path $dir $asset)
        $sumsFile = Join-Path $dir 'checksums.txt'
        Invoke-WebRequest "$base/checksums.txt" -OutFile $sumsFile
        $line = Get-Content $sumsFile | Where-Object { $_ -match [regex]::Escape($asset) } | Select-Object -First 1
        if (-not $line) { throw "no checksum listed for $asset" }
        $want = ($line -split '\s+')[0]
        $got = (Get-FileHash (Join-Path $dir $asset) -Algorithm SHA256).Hash.ToLower()
        if ($want -ne $got) { throw "checksum mismatch for ${asset}: $got, expected $want" }
        Expand-Archive (Join-Path $dir $asset) -DestinationPath $dir -Force
        $dir | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
        "TESTSURFER_VS=$(Join-Path $dir 'vs.exe')" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
        & (Join-Path $dir 'vs.exe') status

    - name: Fetch and start vibesurfer
      if: runner.os != 'Windows'
      shell: bash
      env:
        VS_VERSION: ${{ inputs.vibesurfer-version }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        if [ -z "$VS_VERSION" ]; then
          VS_VERSION=$(sed -n "s/^export const PINNED_VIBESURFER = '\(.*\)';/\1/p" "$ACTION_PATH/src/client.ts")
        fi
        echo "TESTSURFER_VS=npx -y vibesurfer@${VS_VERSION}" >> "$GITHUB_ENV"
        # Download the binary and start the daemon once, so the first
        # test does not pay for it and parallel test files do not race
        # to spawn it.
        npx -y "vibesurfer@${VS_VERSION}" status
