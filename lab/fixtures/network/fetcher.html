<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>fetcher</title><style>body{font:16px system-ui;margin:20px}</style></head>
<body>
<button onclick="go()">Load</button><ul id="l"></ul><p id="err"></p><script>async function go(){try{const r=await fetch("/api/items");const j=await r.json();l.innerHTML=j.items.map(x=>"<li>"+x+"</li>").join("")}catch(e){err.textContent="failed"}}</script>
</body></html>
