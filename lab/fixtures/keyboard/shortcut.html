<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>shortcut</title><style>body{font:16px system-ui;margin:20px}</style></head>
<body>
<p id="o">none</p><script>document.addEventListener("keydown",e=>{if((e.metaKey||e.ctrlKey)&&e.key==="k"){e.preventDefault();o.textContent="palette"}if(e.key==="Escape")o.textContent="closed"})</script>
</body></html>
