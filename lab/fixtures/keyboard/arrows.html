<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>arrows</title><style>body{font:16px system-ui;margin:20px}</style></head>
<body>
<ul role="listbox" aria-label="Pick" tabindex="0" id="lb"><li role="option" aria-selected="true">One</li><li role="option">Two</li><li role="option">Three</li></ul><script>let i=0;const o=[...lb.children];lb.addEventListener("keydown",e=>{if(e.key==="ArrowDown")i=Math.min(i+1,2);if(e.key==="ArrowUp")i=Math.max(i-1,0);o.forEach((x,j)=>x.setAttribute("aria-selected",j===i))})</script>
</body></html>
