<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>list-load</title><style>body{font:16px system-ui;margin:20px}</style></head>
<body>
<ul id="l"></ul><button onclick="more()">Load more</button><script>let n=0;function more(){setTimeout(()=>{for(let i=0;i<5;i++){const li=document.createElement("li");li.textContent="item "+(++n);l.append(li)}},200)}more()</script>
</body></html>
