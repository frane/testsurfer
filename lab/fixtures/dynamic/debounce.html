<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>debounce</title><style>body{font:16px system-ui;margin:20px}</style></head>
<body>
<input aria-label="Search" id="s"><ul id="r"></ul><script>let t;s.addEventListener("input",()=>{clearTimeout(t);t=setTimeout(()=>{r.innerHTML="<li>result for "+s.value+"</li>"},300)})</script>
</body></html>
