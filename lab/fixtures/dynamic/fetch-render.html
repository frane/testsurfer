<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>fetch-render</title><style>body{font:16px system-ui;margin:20px}</style></head>
<body>
<button onclick="go()">Fetch</button><ul id="l"></ul><script>async function go(){const r=await fetch("/api/items");const j=await r.json();l.innerHTML=j.items.map(x=>"<li>"+x+"</li>").join("")}</script>
</body></html>
