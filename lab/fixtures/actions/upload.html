<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>upload</title><style>body{font:16px system-ui;margin:20px}</style></head>
<body>
<label>Files <input type="file" id="f" multiple></label><p id="o"></p><script>f.addEventListener("change",()=>o.textContent=[...f.files].map(x=>x.name+":"+x.size).join(","))</script>
</body></html>
