<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>modifiers</title><style>body{font:16px system-ui;margin:20px}</style></head>
<body>
<a href="#" id="a">link</a><p id="o"></p><script>a.addEventListener("click",e=>{e.preventDefault();o.textContent=[e.shiftKey&&"shift",e.altKey&&"alt",e.metaKey&&"meta",e.ctrlKey&&"ctrl"].filter(Boolean).join("+")})</script>
</body></html>
