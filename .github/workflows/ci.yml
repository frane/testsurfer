name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:unit
      # The same action users put in their own workflows.
      - uses: ./
      - name: e2e against the pinned vibesurfer binary
        run: npm run test:e2e
      - name: example project
        working-directory: examples/todo
        run: |
          npm install
          npm test
