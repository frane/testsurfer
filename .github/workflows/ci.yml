name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:unit
      - name: e2e against the pinned vibesurfer binary
        env:
          TESTSURFER_VS: npx -y vibesurfer@0.2.13
        run: npm run test:e2e
      - name: example project
        env:
          TESTSURFER_VS: npx -y vibesurfer@0.2.13
        working-directory: examples/todo
        run: |
          npm install
          npm test
