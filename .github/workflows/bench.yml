name: bench

# testsurfer vs Playwright on the same flows (bench/bench.mjs), on a
# clean GitHub macOS runner. Run by hand; the table lands in the job
# summary.

on:
  workflow_dispatch:

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build testsurfer
        run: |
          npm ci
          npm run build
      - name: Install bench deps and Playwright browsers
        working-directory: bench
        run: |
          npm ci
          npx playwright install --with-deps webkit chromium
      - uses: ./
      - name: Record the vibesurfer version
        run: echo "VS_VERSION=$($TESTSURFER_VS --version)" >> "$GITHUB_ENV"
      - name: Run the benchmark
        working-directory: bench
        run: |
          TESTSURFER_PROFILE=1 node bench.mjs > table.md
          cat table.md
          {
            echo "## testsurfer vs Playwright"
            echo
            if [ "$RUNNER_OS" = macOS ]; then os="$(sw_vers -productName) $(sw_vers -productVersion)"; else os="$(. /etc/os-release && echo "$PRETTY_NAME")"; fi
            echo "${os} $(uname -m), ${VS_VERSION}, playwright $(npx playwright --version | awk '{print $2}'), $(date -u +%Y-%m-%d). Median of 5 iterations, fresh page per iteration, steady state."
            echo
            cat table.md
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Run the lab on both engines
        run: |
          if [ "$RUNNER_OS" = macOS ]; then export PLAYWRIGHT_BROWSERS_PATH="$HOME/Library/Caches/ms-playwright"; else export PLAYWRIGHT_BROWSERS_PATH="$HOME/.cache/ms-playwright"; fi
          LAB_VS_LABEL="$VS_VERSION" node lab/run.mjs
          {
            echo "## Lab"
            echo
            sed -n '1,40p' lab/RESULTS.md
          } >> "$GITHUB_STEP_SUMMARY"
