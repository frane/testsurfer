name: bench

# testsurfer vs Playwright on the same flows (bench/bench.mjs), on a
# clean GitHub macOS runner. Run by hand; the table lands in the job
# summary.

on:
  workflow_dispatch:
    inputs:
      vibesurfer-ref:
        description: Build vibesurfer from this git ref instead of the pinned release (empty = release)
        required: false
        default: ""

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build testsurfer
        run: |
          npm ci
          npm run build
      - name: Install bench deps and Playwright browsers
        working-directory: bench
        run: |
          npm ci
          npx playwright install --with-deps webkit chromium
      - name: Resolve the lab's .localhost hosts
        # Playwright's WebKit on macOS does not resolve *.localhost
        # (testsurfer's proxy does); the lab serves lab.localhost and
        # lab2.localhost as two origins.
        run: echo "127.0.0.1 lab.localhost lab2.localhost" | sudo tee -a /etc/hosts
      - uses: ./
      - name: Build vibesurfer from source
        if: inputs.vibesurfer-ref != ''
        env:
          REF: ${{ inputs.vibesurfer-ref }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get install -y --no-install-recommends libwebkitgtk-6.0-dev libsoup-3.0-dev libgtk-4-dev nasm pkg-config
          else
            brew install nasm
          fi
          git clone --quiet https://github.com/frane/vibesurfer "$RUNNER_TEMP/vibesurfer"
          git -C "$RUNNER_TEMP/vibesurfer" checkout --quiet "$REF"
          cargo build --release --manifest-path "$RUNNER_TEMP/vibesurfer/Cargo.toml" -p vibesurfer
          "$TESTSURFER_VS" serve --stop >/dev/null 2>&1 || true
          pkill -x vs || true
          echo "TESTSURFER_VS=$RUNNER_TEMP/vibesurfer/target/release/vs" >> "$GITHUB_ENV"
      - name: Record the vibesurfer version
        run: echo "VS_VERSION=$($TESTSURFER_VS --version)" >> "$GITHUB_ENV"
      - name: Run the benchmark
        working-directory: bench
        run: |
          TESTSURFER_PROFILE=1 node bench.mjs > table.md
          cat table.md
          {
            echo "## testsurfer vs Playwright"
            echo
            if [ "$RUNNER_OS" = macOS ]; then os="$(sw_vers -productName) $(sw_vers -productVersion)"; else os="$(. /etc/os-release && echo "$PRETTY_NAME")"; fi
            echo "${os} $(uname -m), ${VS_VERSION}, playwright $(npx playwright --version | awk '{print $2}'), $(date -u +%Y-%m-%d). Median of 5 iterations, fresh page per iteration, steady state."
            echo
            cat table.md
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Run the lab on both engines
        run: |
          if [ "$RUNNER_OS" = macOS ]; then export PLAYWRIGHT_BROWSERS_PATH="$HOME/Library/Caches/ms-playwright"; else export PLAYWRIGHT_BROWSERS_PATH="$HOME/.cache/ms-playwright"; fi
          LAB_VS_LABEL="$VS_VERSION" node lab/run.mjs
          {
            echo "## Lab"
            echo
            sed -n '1,40p' lab/RESULTS.md
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Lab failures on testsurfer, with errors
        if: always()
        working-directory: lab
        run: node ../dist/cli.js test 2>&1 | grep -vE '^\s+at ' | awk '/failing tests/{f=1} f' | head -150 || true
      - name: Checkbox case with debug output
        if: always() && runner.os == 'Linux'
        working-directory: lab
        run: TESTSURFER_DEBUG=1 node ../dist/cli.js test tests/actions.spec.ts 2>&1 | grep -E "ts-debug|✖|Error" | head -60 || true
